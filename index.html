<!DOCTYPE html>

<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My Data Table</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }
        table {
            border-collapse: collapse;
            width: 100%;
        }
        th, td {
            border: 1px solid #333;
            padding: 12px;
            text-align: left;
        }
        th {
            background-color: #4CAF50;
            color: white;
        }
    </style>
</head>
<body>

<h2>My Data</h2>

<table>
    <tr>
        <td>Aditi Gupta</td>
        <td>X</td>
        <td>C</td>
    </tr>
    <tr>
        <td>Shakti Yadav</td>
        <td>X</td>
        <td>D</td>
    </tr>
</table>

</body>
</html>
